name: Weekly stability

# Windows-only weekly soak (plan Todo 6). CodeQL currently schedules Monday
# 04:23 UTC (`.github/workflows/codeql.yml`); this run is Wednesday 06:00 UTC
# so the two scheduled jobs never share a window. Release tagging stays on
# `hubfetch-release` with cancel-in-progress: false — this workflow never
# shares that group and has no release permissions.
on:
  schedule:
    - cron: '0 6 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hubfetch-stability-weekly
  cancel-in-progress: ${{ github.event_name == 'schedule' }}

defaults:
  run:
    shell: bash

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  native:
    name: Native rebuild and tests
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild and test the native Job Object addon
        run: |
          set -o pipefail
          mkdir -p .ci-logs
          pnpm --filter hubfetch-desktop native:rebuild 2>&1 | tee .ci-logs/native.log

      - name: Upload native rebuild diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stability-native-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: .ci-logs/

  packaged-smoke:
    needs: verify
    uses: ./.github/workflows/packaged-smoke.yml
    with:
      commit_sha: ${{ github.sha }}
      publishable: false
