name: Verify

on:
  workflow_call:

permissions:
  contents: read

# Every gate below runs on Windows only (GitHub windows-latest). The `bash`
# shell is Git Bash, which ships with GitHub's Windows runners; no Linux/macOS
# runner or xvfb is used. Playwright Electron runs headless on Windows.
defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Format, lint, typecheck, coverage, build, Windows E2E
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate and verify the release SBOM
        run: |
          pnpm release:sbom
          node .github/scripts/release-tools/verify-sbom.mjs artifacts/release/HubFetch-$(node -p "require('./package.json').version").cdx.json

      - name: Audit production dependencies (high and critical)
        run: |
          set -o pipefail
          mkdir -p .ci-logs
          pnpm audit --prod --audit-level high 2>&1 | tee .ci-logs/audit.log

      - name: Check formatting
        run: |
          set -o pipefail
          pnpm format:check 2>&1 | tee .ci-logs/format.log

      - name: Lint (zero warnings)
        run: |
          set -o pipefail
          pnpm lint 2>&1 | tee .ci-logs/lint.log

      - name: Check i18n catalogs
        run: pnpm i18n:check

      - name: Typecheck
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee .ci-logs/typecheck.log

      - name: Test release safety tooling
        run: pnpm test:release-tools

      - name: Test no-updater policy
        run: pnpm test:no-updater

      - name: Test docs policy (link, contract, notices, command-reference)
        run: pnpm test:docs

      - name: Test visual-baseline tooling
        run: pnpm test:visual-tools

      - name: Unit tests with coverage
        run: |
          set -o pipefail
          pnpm test:coverage 2>&1 | tee .ci-logs/coverage.log

      - name: Build
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee .ci-logs/build.log

      - name: Verify strict-CSP syntax highlighting bundle
        run: pnpm verify:syntax-build

      - name: Windows E2E
        run: |
          set -o pipefail
          pnpm --filter hubfetch-desktop test:e2e \
            2>&1 | tee .ci-logs/e2e.log

      - name: Visual regression
        run: |
          set -o pipefail
          pnpm --filter hubfetch-desktop test:visual \
            2>&1 | tee .ci-logs/visual.log

      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
          path: |
            .ci-logs/
            coverage/
            apps/desktop/coverage/
            apps/desktop/playwright-report/
            apps/desktop/test-results/
