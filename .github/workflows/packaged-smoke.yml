name: Packaged smoke

on:
  workflow_call:
    inputs:
      commit_sha:
        description: Exact source commit to package
        required: true
        type: string
      publishable:
        description: Upload the Windows x64 ZIP for release preflight
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Decision (Todo 17): packaged-smoke stays as its own reusable workflow but is
# reduced to a single Windows x64 job. The macOS/Linux matrix and the macOS
# keychain-import step are removed; nothing here ever runs on a non-Windows
# runner and no signing certificate is required.
defaults:
  run:
    shell: bash

jobs:
  package:
    name: Package and smoke test (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out verified source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the unsigned Windows x64 ZIP without publishing
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          set -o pipefail
          mkdir -p .ci-logs
          {
            pnpm --filter hubfetch-desktop exec electron-vite build
            pnpm --filter hubfetch-desktop exec electron-builder --win --x64 --publish never
          } 2>&1 | tee ".ci-logs/build-windows.log"

      - name: Run packaged smoke test
        run: |
          set -euo pipefail
          set -o pipefail
          pnpm --filter hubfetch-desktop exec \
            playwright test --config=playwright.packaged.config.ts \
            2>&1 | tee ".ci-logs/smoke-windows.log"

      - name: Upload the Windows x64 release ZIP
        if: inputs.publishable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/desktop/release/*.zip

      - name: Upload packaged smoke diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packaged-smoke-windows-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
          path: |
            .ci-logs/
            apps/desktop/playwright-report/
            apps/desktop/test-results/
