[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hubfetch"
version = "0.1.0"
description = "Windows desktop management for local Hugging Face transfers."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "PySide6==6.11.1",
    "huggingface_hub==1.27.0",
    "keyring>=25.6,<26",
    "pydantic>=2.12,<3",
]

[dependency-groups]
dev = [
    "PyInstaller==6.22.0",
    "basedpyright>=1.31,<2",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "pytest-qt>=4.5,<5",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hubfetch"]

[tool.uv]
default-groups = ["dev"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.12"
pythonPlatform = "Windows"
include = ["src", "tests", "scripts"]
exclude = [
    "**/__pycache__",
    "**/.venv",
    "**/artifacts",
    "**/build",
    "**/dist",
]
# reportUnusedCallResult is disabled: PySide6's idiomatic API returns
# (QSignal.connect -> Connection, setParent -> QWidget, addWidget, property
# setters, show/hide) are conventionally ignored, so the diagnostic produced
# 243 Qt-idiom warnings across src/ and tests/. basedpyright exits nonzero on
# any warning, and the release gate requires exit 0; type errors are
# unaffected and remain fatal.
reportUnusedCallResult = "none"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests", "scripts"]
exclude = [
    ".git",
    ".omo",
    ".venv",
    "Webfatch_Fail2Suc",
    "artifacts",
    "build",
    "dist",
    "package",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
    "D203",
    "D213",
    "FBT001",
    "FBT002",
    "FIX002",
    "ISC001",
    "TD002",
    "TD003",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "D", "PLR2004", "S101", "SLF001"]
"scripts/**/*.py" = ["INP001", "T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
filterwarnings = ["error"]
markers = [
    "windows: requires Windows-specific behavior or APIs",
    "integration: exercises a real adapter or external process",
    "live: requires live Hugging Face or Git network access",
]

[tool.coverage.run]
source = ["src"]
branch = true
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
