appId: io.github.oranimp.hubfetch
productName: HubFetch
copyright: Copyright © 2026 HubFetch contributors

directories:
  buildResources: build
  output: release

files:
  - out/**

# Todo 25: the only native artifact the app ships beyond node_modules is the
# Electron-ABI x64 `hubfetch_job.node` produced by `pnpm native:build`. It is
# staged under resources/native/ OUTSIDE the asar; the main-process loader
# resolves it via process.resourcesPath. No source, PDB/object, or toolchain
# files are ever packaged. electron-builder fails fast if the addon is missing
# (it must be built before packaging).
extraResources:
  - from: native/windows/build/Release/hubfetch_job.node
    to: native/hubfetch_job.node

asarUnpack:
  - '**/*.node'

npmRebuild: true
electronVersion: 43.1.0

# HubFetch ships a single unsigned Windows x64 ZIP: no installer, no
# updater/feed metadata, no other platform targets, and no code-signing
# requirement. Releases are manually installed from the GitHub Releases page.
# See docs/signing.md for the unsigned disclosure.
win:
  target:
    - target: zip
      arch:
        - x64
  # artifactName is space-free so the built file's name is stable and
  # predictable across every CI job.
  artifactName: 'HubFetch-${version}-windows-x64.zip'
