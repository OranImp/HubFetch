appId: io.github.oranimp.hubfetch
productName: HubFetch
copyright: Copyright © 2026 HubFetch contributors

directories:
  buildResources: build
  output: release

files:
  - out/**

asarUnpack:
  - '**/*.node'

npmRebuild: true
electronVersion: 43.1.0

# HubFetch ships a single unsigned Windows x64 ZIP: no installer, no
# updater/feed metadata, no other platform targets, and no code-signing
# requirement. Releases are manually installed from the GitHub Releases page.
# See docs/signing.md for the unsigned disclosure.
win:
  target:
    - target: zip
      arch:
        - x64
  # artifactName is space-free so the built file's name is stable and
  # predictable across every CI job.
  artifactName: 'HubFetch-${version}-windows-x64.zip'
