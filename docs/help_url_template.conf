# Optional Help URL template — copy this file into your app-data directory and
# set the URL to a releases/download page you control. The value is opened in
# the default browser by the Help action only when the user opts in; HubFetch
# never polls releases and performs no update check. Keep this file free of
# credentials, tokens, or machine-specific data.

[help]
url = https://example.com/hubfetch/releases
